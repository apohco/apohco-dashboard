AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  APOHCO Financial Dashboard backend. Standalone SAM stack — independent of
  the Full Circle Podcast Tool stack. Provisions the API Gateway REST API
  and Lambda functions for QBO sync, settings, and financial reports.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  DbHost:
    Type: String
    Description: RDS PostgreSQL endpoint (apohco-dashboard schema, separate from podcast tool DB)
  DbName:
    Type: String
    Default: apohco_dashboard
  DbCredentialsSecretArn:
    Type: String
    Description: 'Secrets Manager secret ARN holding {"username": "...", "password": "..."} for the DB'
  AppSecretsArn:
    Type: String
    Description: >-
      Secrets Manager secret ARN holding QBO app + crypto config: qboClientId,
      qboClientSecret, qboRedirectUri, qboEnvironment (sandbox|production),
      oauthStateSecret, tokenEncryptionKey (base64, 32 bytes)
  FrontendUrl:
    Type: String
    Description: Deployed frontend base URL (e.g. Amplify domain), used for OAuth redirects and CORS
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets (in the existing VPC) the Lambda functions use to reach RDS
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group(s) allowing the Lambda functions to reach the RDS instance on its port

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    CodeUri: ./
    Environment:
      Variables:
        DB_HOST: !Ref DbHost
        DB_NAME: !Ref DbName
        DB_CREDENTIALS_SECRET_ARN: !Ref DbCredentialsSecretArn
        APP_SECRETS_ARN: !Ref AppSecretsArn
        FRONTEND_URL: !Ref FrontendUrl
        STAGE: !Ref Stage
        # Controller AI matching (Phase 3): Claude on Amazon Bedrock.
        AI_MODEL_ID: us.anthropic.claude-opus-5-5
        AI_EFFORT: low
    VpcConfig:
      SubnetIds: !Ref VpcSubnetIds
      SecurityGroupIds: !Ref VpcSecurityGroupIds

Resources:
  # --- Cognito: invite-only user pool, separate from the podcast tool's pool ---
  ApohcoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub apohco-dashboard-${Stage}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: 'Your APOHCO Financial Dashboard account'
          EmailMessage: >-
            Your username is {username} and your temporary password is {####}.
            Sign in at the APOHCO Financial Dashboard to set a new password.
      UsernameConfiguration:
        CaseSensitive: false
      # Every user must sign in with an authenticator app (TOTP) on top of
      # their password. Users without one are taken through setup at their
      # next sign-in (see frontend/src/pages/Login.jsx). Required pool-wide
      # because Cognito ID tokens don't record whether MFA was used, so
      # the API couldn't enforce it per user.
      MfaConfiguration: 'ON'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true
          # SoftwareAdmin | SoftwareRep | Owner | Manager | TeamMember (see claude.md)
        - Name: groupId
          AttributeDataType: String
          Mutable: true
          # GroupId (UUID) this user belongs to; blank for platform-level roles
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  ApohcoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ApohcoUserPool
      ClientName: apohco-dashboard-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # Platform-level Cognito Groups (see claude.md "Platform-Level Roles").
  # Practice-level groups (e.g. "APOHCO_Owner") are created per Group Practice
  # at Group-creation time, not statically here.
  SoftwareAdminUserPoolGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref ApohcoUserPool
      GroupName: SoftwareAdmin
      Description: Full rights across all Groups, all tenants, all settings

  SoftwareRepUserPoolGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref ApohcoUserPool
      GroupName: SoftwareRep
      Description: Technical onboarding — QBO connections, Group setup

  # Sole gate for the Controller module (together with the SoftwareAdmin
  # role). Only Paul is added to this group, by hand: see docs/SETUP.md.
  ControllerOwnerUserPoolGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref ApohcoUserPool
      GroupName: ControllerOwner
      Description: Only member may use the Controller module

  # --- Controller module: async GL pulls ---
  # One message per month to pull ({ taskId }). Visibility timeout is 6x
  # the worker timeout, per AWS guidance for SQS event sources. After 3
  # failed receives a message goes to the dead-letter queue (the worker
  # also marks the task Failed on its 3rd attempt).
  CtrlGlPullDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub apohco-ctrl-gl-pull-dlq-${Stage}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CtrlGlPullQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub apohco-ctrl-gl-pull-${Stage}
      VisibilityTimeout: 1080
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CtrlGlPullDeadLetterQueue.Arn
        maxReceiveCount: 3

  # Temporary holding area for Manual Upload CSV/Excel files — uploaded via
  # a presigned URL, parsed and deleted by manualUpload, with a 1-day
  # lifecycle rule as a backstop in case explicit cleanup fails.
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub apohco-dashboard-uploads-${Stage}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter1Day
            Status: Enabled
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins:
              - !Ref FrontendUrl
            AllowedHeaders: ['*']
            MaxAge: 3000

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: postConfirmation
      Handler: src/functions/auth/postConfirmation/index.handler
      Policies: &lambdaPolicies
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
        - VPCAccessPolicy: {}

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt ApohcoUserPool.Arn

  ApohcoDashboardApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ApohcoUserPool.Arn
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowOrigin: !Sub "'${FrontendUrl}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  QboOAuthConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: qboOAuthConnect
      Handler: src/functions/qbo/qboOAuthConnect/index.handler
      Policies: *lambdaPolicies
      # Cognito env vars are added per-function (not in Globals) to avoid a
      # circular dependency: ApohcoUserPool's PostConfirmation trigger
      # references PostConfirmationFunction, which must NOT in turn
      # reference ApohcoUserPool/ApohcoUserPoolClient (it doesn't need to —
      # it's invoked directly by Cognito, not via API Gateway auth).
      Environment: &cognitoAuthEnv
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
      Events:
        Connect:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/qbo/connect
            Method: post

  QboOAuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: qboOAuthCallback
      Handler: src/functions/qbo/qboOAuthCallback/index.handler
      Policies: *lambdaPolicies
      Events:
        Callback:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/qbo/callback
            Method: get
            Auth:
              Authorizer: NONE

  SyncQBODataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: syncQBOData
      Handler: src/functions/qbo/syncQBOData/index.handler
      Timeout: 60
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Sync:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/qbo/sync
            Method: post

  ManualUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manualUpload
      Handler: src/functions/qbo/manualUpload/index.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${UploadsBucket.Arn}/*'
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          UPLOADS_BUCKET: !Ref UploadsBucket
      Events:
        Presign:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/qbo/manual-upload/presign
            Method: post
        Preview:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/qbo/manual-upload/preview
            Method: post
        Confirm:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/qbo/manual-upload/confirm
            Method: post

  ManageGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageGroups
      Handler: src/functions/settings/manageGroups/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/groups
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/groups/{groupId}
            Method: any

  # Settings > Users. SoftwareAdmin only (checked in the handler). The IAM
  # policy allows only the Cognito admin calls the screen needs, on this
  # app's own user pool; there is no AdminDeleteUser.
  ManageUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageUsers
      Handler: src/functions/settings/manageUsers/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminDeleteUserAttributes
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminSetUserMFAPreference
                - cognito-idp:AdminResetUserPassword
                - cognito-idp:AdminUserGlobalSignOut
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt ApohcoUserPool.Arn
        - VPCAccessPolicy: {}
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/users
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/users/{username}
            Method: put
        Action:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/users/{username}/{action}
            Method: post

  ManageAccountGroupingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageAccountGroupings
      Handler: src/functions/settings/manageAccountGroupings/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/account-groupings
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/account-groupings/{groupingId}
            Method: any

  ManageChartOfAccountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageChartOfAccounts
      Handler: src/functions/settings/manageChartOfAccounts/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/chart-of-accounts
            Method: any

  ManageConsolidationGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageConsolidationGroups
      Handler: src/functions/settings/manageConsolidationGroups/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/consolidation-groups
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/consolidation-groups/{consolidationGroupId}
            Method: any

  ManageReportLayoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageReportLayout
      Handler: src/functions/settings/manageReportLayout/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/report-layout
            Method: any

  ManageReportViewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageReportViews
      Handler: src/functions/settings/manageReportViews/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/report-views
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/report-views/{reportViewId}
            Method: any

  ManageQBOsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageQBOs
      Handler: src/functions/settings/manageQBOs/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/qbos
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/settings/qbos/{qboId}
            Method: any

  GetProfitAndLossFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getProfitAndLoss
      Handler: src/functions/reports/getProfitAndLoss/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/reports/profit-and-loss
            Method: post

  GetBalanceSheetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getBalanceSheet
      Handler: src/functions/reports/getBalanceSheet/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/reports/balance-sheet
            Method: post

  GetCashFlowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getCashFlow
      Handler: src/functions/reports/getCashFlow/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/reports/cash-flow
            Method: post

  # Daily renewal of every API-connected QBO file's OAuth tokens, so a file
  # nobody pulls from for a while doesn't lose its connection. Reads no
  # financial data. No API route.
  RefreshQBOTokensFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: refreshQBOTokens
      Handler: src/functions/qbo/refreshQBOTokens/index.handler
      Timeout: 120
      Policies: *lambdaPolicies
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Description: Renew QBO OAuth tokens daily (09:00 UTC)

  # --- Controller module (SoftwareAdmin + ControllerOwner only; see
  # shared/controllerAuth.js). Read-only to QuickBooks. ---
  StartCtrlSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: startCtrlSync
      Handler: src/functions/controller/startCtrlSync/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
        - VPCAccessPolicy: {}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CtrlGlPullQueue.QueueName
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          CTRL_GL_PULL_QUEUE_URL: !Ref CtrlGlPullQueue
      Events:
        Start:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/sync
            Method: post

  CtrlGlPullWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlGlPullWorker
      Handler: src/functions/controller/ctrlGlPullWorker/index.handler
      Timeout: 180
      MemorySize: 512
      Policies: *lambdaPolicies
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt CtrlGlPullQueue.Arn
            BatchSize: 1
            # Keeps us well inside QBO's per-company API rate limits.
            ScalingConfig:
              MaximumConcurrency: 2

  GetCtrlJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getCtrlJobs
      Handler: src/functions/controller/getCtrlJobs/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/jobs
            Method: get
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/jobs/{jobId}
            Method: get

  GetCtrlLedgerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getCtrlLedger
      Handler: src/functions/controller/getCtrlLedger/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Overview:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/overview
            Method: get
        Lines:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/lines
            Method: get

  # GL file uploads (CSV/XLSX) stored as Controller snapshots. Reads the
  # file from the uploads bucket; never writes to QuickBooks or to the
  # dashboard's own tables.
  CtrlGlUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlGlUpload
      Handler: src/functions/controller/ctrlGlUpload/index.handler
      # API Gateway stops waiting at 29s; the extra memory is CPU for
      # parsing large spreadsheets.
      Timeout: 30
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${UploadsBucket.Arn}/controller-uploads/*'
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          UPLOADS_BUCKET: !Ref UploadsBucket
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/uploads
            Method: any
        Analyze:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/uploads/{uploadId}/analyze
            Method: post
        Import:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/uploads/{uploadId}/import
            Method: post

  # Phase 2: review runs, the review queue and decisions (rules + history
  # engine in shared/reviewEngine.js). Database only; no QuickBooks calls.
  CtrlReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlReview
      Handler: src/functions/controller/ctrlReview/index.handler
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
        - VPCAccessPolicy: {}
        # A review run starts its AI pass (Phase 3).
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CtrlAiQueue.QueueName
        # "Search All" evidence jobs (Phase 4).
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CtrlEvidenceQueue.QueueName
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          CTRL_AI_QUEUE_URL: !Ref CtrlAiQueue
          CTRL_EVIDENCE_QUEUE_URL: !Ref CtrlEvidenceQueue
      Events:
        Settings:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/settings
            Method: any
        Runs:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/runs
            Method: any
        Lines:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/lines
            Method: get
        Decisions:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/decisions
            Method: post
        Accounts:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/accounts
            Method: get
        DueToFrom:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/due-to-from
            Method: put
        EvidenceSearch:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/review/evidence-search
            Method: post

  # --- Controller Phase 3: AI matching (Claude on Amazon Bedrock) ---
  # One message per AI batch ({ batchId }), i.e. one model call. Visibility
  # timeout is 6x the worker timeout; after 3 failed receives a message
  # goes to the dead-letter queue (the worker marks the batch Failed on
  # its 3rd attempt).
  CtrlAiDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub apohco-ctrl-ai-dlq-${Stage}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CtrlAiQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub apohco-ctrl-ai-${Stage}
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CtrlAiDeadLetterQueue.Arn
        maxReceiveCount: 3

  # Reads stored GL lines, asks the model, stores suggestions. Never calls
  # QuickBooks. The only function allowed to call Bedrock.
  CtrlAiWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlAiWorker
      Handler: src/functions/controller/ctrlAiWorker/index.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
            # Anthropic models only, through a US inference profile (which
            # routes to the model in any US region).
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.*
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.*
                - arn:aws:bedrock:us-east-2::foundation-model/anthropic.*
                - arn:aws:bedrock:us-west-2::foundation-model/anthropic.*
        - VPCAccessPolicy: {}
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt CtrlAiQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 2

  # AI jobs (start / progress / results) and usage. Database + queue only.
  CtrlAiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlAi
      Handler: src/functions/controller/ctrlAi/index.handler
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
        - VPCAccessPolicy: {}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CtrlAiQueue.QueueName
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          CTRL_AI_QUEUE_URL: !Ref CtrlAiQueue
      Events:
        Status:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/ai/status
            Method: get
        Usage:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/ai/usage
            Method: get
        Jobs:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/ai/jobs
            Method: post
        Job:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/ai/jobs/{jobId}
            Method: get

  # --- Controller Phase 4: evidence from Google Workspace (Gmail) ---
  # Only these three functions can read the Google service account key
  # (Secrets Manager: apohco-dashboard/google-service-account, stored by
  # Paul; see SETUP.md section 10). Calls go out through the NAT gateway.
  CtrlEvidenceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub apohco-ctrl-evidence-dlq-${Stage}
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CtrlEvidenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub apohco-ctrl-evidence-${Stage}
      VisibilityTimeout: 1080
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CtrlEvidenceDeadLetterQueue.Arn
        maxReceiveCount: 3

  CtrlEvidenceWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlEvidenceWorker
      Handler: src/functions/controller/ctrlEvidenceWorker/index.handler
      Timeout: 180
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:apohco-dashboard/google-service-account-*
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          GOOGLE_SA_SECRET_ID: apohco-dashboard/google-service-account
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt CtrlEvidenceQueue.Arn
            BatchSize: 1
            # Keeps Gmail API use well inside per-user quotas.
            ScalingConfig:
              MaximumConcurrency: 2

  CtrlEvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlEvidence
      Handler: src/functions/controller/ctrlEvidence/index.handler
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:apohco-dashboard/google-service-account-*
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          GOOGLE_SA_SECRET_ID: apohco-dashboard/google-service-account
      Events:
        Line:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/evidence
            Method: get
        Find:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/evidence/find
            Method: post
        Job:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/evidence/jobs/{jobId}
            Method: get
        Preview:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/evidence/{candidateId}/preview
            Method: get

  CtrlGoogleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlGoogle
      Handler: src/functions/controller/ctrlGoogle/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecretArn
                - !Ref AppSecretsArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:apohco-dashboard/google-service-account-*
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref ApohcoUserPool
          COGNITO_CLIENT_ID: !Ref ApohcoUserPoolClient
          GOOGLE_SA_SECRET_ID: apohco-dashboard/google-service-account
      Events:
        Settings:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/google
            Method: any
        Test:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/google/test
            Method: post
        Directory:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/google/directory
            Method: get
        Sources:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/google/sources
            Method: put

  # Phase 2b: conflicts queue (rule vs history) and its three resolutions.
  # Database only; no QuickBooks calls.
  CtrlConflictsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlConflicts
      Handler: src/functions/controller/ctrlConflicts/index.handler
      MemorySize: 512
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/conflicts
            Method: get
        Preview:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/conflicts/{lineId}/preview
            Method: post
        Resolve:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/conflicts/{lineId}/resolve
            Method: post

  # Phase 2b: trends (spend by entity, vendor splits) and trend checks.
  CtrlTrendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlTrends
      Handler: src/functions/controller/ctrlTrends/index.handler
      MemorySize: 1024
      Timeout: 30
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Trends:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/trends
            Method: get

  ManageCtrlVendorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageCtrlVendors
      Handler: src/functions/controller/manageCtrlVendors/index.handler
      MemorySize: 512
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/vendors
            Method: get
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/vendors/{vendorId}
            Method: put
        Profile:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/vendors/{vendorId}
            Method: get
        RuleTest:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/vendors/{vendorId}/rules/test
            Method: post
        Merge:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/vendors/{vendorId}/merge
            Method: post

  ManageCtrlEntitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: manageCtrlEntities
      Handler: src/functions/controller/manageCtrlEntities/index.handler
      Policies: *lambdaPolicies
      Environment: *cognitoAuthEnv
      Events:
        Collection:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/entities
            Method: any
        Item:
          Type: Api
          Properties:
            RestApiId: !Ref ApohcoDashboardApi
            Path: /api/controller/entities/{entityId}
            Method: any

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub https://${ApohcoDashboardApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID (for frontend VITE_COGNITO_USER_POOL_ID and admin CLI commands)
    Value: !Ref ApohcoUserPool
  UserPoolClientId:
    Description: Cognito App Client ID (for frontend VITE_COGNITO_CLIENT_ID)
    Value: !Ref ApohcoUserPoolClient
